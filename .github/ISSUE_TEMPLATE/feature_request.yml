name: "Feature request"
description: "Propose a new feature or improvement for the website or future versions"
title: "[FEATURE] "
labels: ["enhancement", "website"]

body:
  - type: dropdown
    id: scope
    attributes:
      label: "Scope"
      description: "Indicate where this feature applies"
      options:
        - Website (current)
        - Future version / roadmap
        - Both
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: "Area"
      description: "Select the relevant area of the website"
      options:
        - UI / UX
        - Performance
        - Accessibility
        - SEO
        - Authentication / Accounts
        - Content / CMS
        - API / Backend
        - Other
    validations:
      required: true

  - type: textarea
    id: feature
    attributes:
      label: "Feature Description"
      description: "Provide a clear and concise description of the proposed feature"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "Problem Statement"
      description: "Explain the problem this feature aims to solve"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "Describe how this feature could be implemented"

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "List any alternative approaches or workarounds"

  - type: textarea
    id: impact
    attributes:
      label: "User and Business Impact"
      description: "Explain the expected benefits and who will be affected"

  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      description: "Indicate the suggested priority"
      options:
        - Low
        - Medium
        - High

  - type: textarea
    id: additional
    attributes:
      label: "Additional Context"
      description: "Include mockups, references, or examples if available"