name: "Bug report"
description: "Report a bug or unexpected behavior on the website"
title: "[BUG] "
labels: ["bug", "website"]

body:
    - type: dropdown
      id: scope
      attributes:
          label: "Scope"
          description: "Indicate where this bug occurs"
          options:
              - Website (current)
              - Future version / roadmap
              - Both
      validations:
          required: true

    - type: dropdown
      id: area
      attributes:
          label: "Area"
          description: "Select the relevant area of the website"
          options:
              - UI / UX
              - Performance
              - Accessibility
              - SEO
              - Authentication / Accounts
              - Content / CMS
              - API / Backend
              - Other
      validations:
          required: true

    - type: textarea
      id: description
      attributes:
          label: "Bug Description"
          description: "Provide a clear and concise description of the bug"
      validations:
          required: true

    - type: textarea
      id: steps
      attributes:
          label: "Steps to Reproduce"
          description: "List the steps to reproduce the behavior"
          placeholder: |
              1. Go to '...'
              2. Click on '...'
              3. See error
      validations:
          required: true

    - type: dropdown
      id: priority
      attributes:
          label: "Priority"
          description: "Indicate the suggested priority"
          options:
              - Low
              - Medium
              - High
