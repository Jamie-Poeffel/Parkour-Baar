services:
  # The Next.js app. Reached only through the gateway below.
  web:
    image: ${APP_IMAGE:?Set APP_IMAGE in .env}
    platform: linux/arm64
    container_name: parkour-baar-app
    restart: unless-stopped
    env_file:
      - ./app.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  # Sits in front of the app: serves the maintenance page during a window from
  # ./maintenance/maintenance.json (and whenever the app is down) and pauses /
  # resumes the UptimeRobot monitors. It takes over the network alias "app" on
  # :3000, so the Cloudflare tunnel's existing target (http://app:3000) is
  # unchanged. The app container can be stopped or rebuilt during maintenance.
  gateway:
    image: node:22-alpine
    platform: linux/arm64
    container_name: parkour-baar-gateway
    restart: unless-stopped
    working_dir: /gateway
    command: ["node", "server.mjs"]
    env_file:
      - path: ./gateway.env
        required: false
    environment:
      PORT: "3000"
      UPSTREAM: http://web:3000
      DATA_DIR: /data
      MAINTENANCE_TZ: Europe/Zurich
    volumes:
      - ./gateway:/gateway:ro
      - ./maintenance:/data
    networks:
      default:
        aliases:
          - app
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/__gateway/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    platform: linux/arm64
    container_name: parkour-baar-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - ./tunnel.env
    depends_on:
      gateway:
        condition: service_started
