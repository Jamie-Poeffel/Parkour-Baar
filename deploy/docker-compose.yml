services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE in .env}
    platform: linux/arm64
    container_name: parkour-baar-app
    restart: unless-stopped
    env_file:
      - ./app.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  cloudflared:
    image: cloudflare/cloudflared:latest
    platform: linux/arm64
    container_name: parkour-baar-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - ./tunnel.env
    depends_on:
      app:
        condition: service_started
